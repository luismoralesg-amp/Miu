<!doctype html>
<html lang="es" data-piel="p1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calificar en lote · MiU</title>
<link rel="stylesheet" href="assets/tokens.css" />
<script src="assets/seed.js"></script>
<script src="assets/setup.js"></script>
<script src="assets/p1.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body>
  <div class="mx-auto max-w-[1240px] px-5 pb-10 md:px-12 md:pb-20">
    <div id="shell-top"></div>
    <section class="pt-10 pb-6 md:pt-14">
      <p id="contexto" class="text-[15px] text-muted"></p>
      <h1 id="titulo" class="display mt-2 text-[36px] leading-[1.04] font-medium md:text-[56px]"></h1>
      <div class="mt-5 flex flex-wrap items-center gap-x-6 gap-y-2 text-[15px]">
        <p><span id="hechas" class="display tnum text-[28px]"></span> <span class="text-muted" id="hechas-t"></span></p>
        <p class="hidden flex-wrap items-center gap-x-3 gap-y-1 text-sm text-muted md:flex">
          <span><kbd class="rounded border border-line px-1.5">j</kbd> <kbd class="rounded border border-line px-1.5">k</kbd> moverte</span>
          <span><kbd class="rounded border border-line px-1.5">0–9</kbd> nota</span>
          <span><kbd class="rounded border border-line px-1.5">Enter</kbd> guardar</span>
        </p>
      </div>
    </section>
    <main>
      <ul id="movil" class="divide-y divide-line border-y border-line md:hidden"></ul>
      <div class="hidden overflow-x-auto border-y border-line md:block">
        <table class="tnum w-full min-w-[720px] text-left text-[15px]">
          <thead class="text-xs text-muted"><tr class="border-b border-line"><th class="py-3 pr-4 pl-3 font-medium">Estudiante</th><th class="py-3 pr-4 font-medium">Entregó</th><th class="py-3 pr-4 font-medium">Archivo</th><th class="w-24 py-3 pr-4 text-right font-medium">Nota</th><th class="py-3 pr-4 font-medium">Justificación</th><th class="py-3 font-medium">Estado</th></tr></thead>
          <tbody id="filas" class="divide-y divide-line"></tbody>
        </table>
      </div>
      <div class="sticky bottom-24 mt-6 flex flex-col gap-4 rounded-[20px] border border-line bg-card p-5 shadow-float md:bottom-6 md:flex-row md:items-center md:justify-between">
        <p id="resumen" class="text-[15px]"></p>
        <button id="publicar" class="inline-flex h-12 items-center justify-center gap-2 rounded-full bg-ink px-6 font-semibold text-card"></button>
      </div>
    </main>
  </div>
  <div id="shell-bottom"></div>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.61.0/dist/umd/lucide.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    window.SEED.usuario = { ...window.SEED.usuario, nombre: "Carlos", apellido: "Méndez" };
    P1.shell("calificar", P1.NAV_AUXILIAR);
    const L = window.SEED.lote, c = MIU.curso(L.curso);
    $("contexto").innerHTML = `<span class="inline-flex items-center gap-1.5">${P1.dot(L.curso)}${c.nombre}</span> · Sección ${c.seccion} · cerró ${MIU.relativo(L.cierre)} a las ${MIU.hhmm(MIU.parse(L.cierre))}`;
    $("titulo").textContent = L.actividad;
    let filas = L.entregas.map((e) => ({ ...e, guardada: e.nota !== null }));
    let act = filas.findIndex((f) => f.actual);
    const pinta = () => {
      $("filas").innerHTML = filas.map((f, i) => { const bajo = f.nota !== null && f.nota < L.umbral; const falta = bajo && !f.justificacion; return `
        <tr data-i="${i}" class="${i === act ? "bg-card outline-2 -outline-offset-2 outline-ink" : ""}" aria-selected="${i === act}">
          <td class="py-3 pr-4 pl-3"><span class="block font-semibold">${f.alumno}</span><span class="text-sm text-muted">${f.carne}</span></td>
          <td class="py-3 pr-4 text-sm">${MIU.fechaCorta(f.hora)} ${MIU.hhmm(MIU.parse(f.hora))}${f.atrasada ? ' <span class="ml-1 rounded-full bg-warn-soft px-2 py-0.5 text-xs font-semibold text-warn">Atrasada</span>' : ""}</td>
          <td class="py-3 pr-4 text-sm"><a href="#" class="inline-flex items-center gap-1.5 underline underline-offset-4"><i data-lucide="file-code" class="size-4"></i>closures.zip</a></td>
          <td class="py-3 pr-4 text-right"><input aria-label="Nota de ${f.alumno}" inputmode="numeric" value="${f.nota ?? ""}" data-nota="${i}" class="display h-11 w-20 rounded-lg border ${falta ? "border-danger" : "border-line"} bg-canvas text-center text-xl outline-none focus:border-ink" /></td>
          <td class="py-3 pr-4">${bajo ? `<input aria-label="Justificación para ${f.alumno}" value="${f.justificacion ?? ""}" placeholder="Obligatoria bajo ${L.umbral}" data-just="${i}" class="h-11 w-full min-w-[220px] rounded-lg border ${falta ? "border-danger" : "border-line"} bg-canvas px-3 text-sm outline-none focus:border-ink" />${falta ? `<span class="mt-1 block text-xs text-danger">Escribe por qué la nota es menor a ${L.umbral}.</span>` : ""}` : ""}</td>
          <td class="py-3 text-sm">${f.guardada ? '<span class="inline-flex items-center gap-1 text-ok"><i data-lucide="check" class="size-4"></i>Guardada</span>' : '<span class="text-muted">Sin nota</span>'}</td>
        </tr>`; }).join("");
      $("movil").innerHTML = filas.map((f, i) => { const bajo = f.nota !== null && f.nota < L.umbral; return `
        <li class="flex flex-col gap-3 py-4 ${i === act ? "-mx-3 rounded-xl bg-card px-3" : ""}">
          <div class="flex items-start justify-between gap-4">
            <span><span class="block font-semibold">${f.alumno}</span><span class="text-sm text-muted">${MIU.fechaCorta(f.hora)} ${MIU.hhmm(MIU.parse(f.hora))}${f.atrasada ? " · atrasada" : ""} · <a href="#" class="underline underline-offset-4">closures.zip</a></span></span>
            <input aria-label="Nota de ${f.alumno}" inputmode="numeric" value="${f.nota ?? ""}" class="display h-12 w-20 shrink-0 rounded-lg border border-line bg-canvas text-center text-xl" />
          </div>
          ${bajo ? `<input aria-label="Justificación para ${f.alumno}" value="${f.justificacion ?? ""}" placeholder="Justificación obligatoria bajo ${L.umbral}" class="h-11 rounded-lg border border-line bg-canvas px-3 text-sm" />` : ""}
          <span class="text-sm ${f.guardada ? "text-ok" : "text-muted"}">${f.guardada ? "Guardada" : "Sin nota"}</span>
        </li>`; }).join("");
      const hechas = filas.filter((f) => f.guardada);
      $("hechas").textContent = `${hechas.length} de ${L.total}`;
      $("hechas-t").textContent = "calificadas";
      const prom = hechas.length ? Math.round(hechas.reduce((s, f) => s + f.nota, 0) / hechas.length) : 0;
      const bajas = hechas.filter((f) => f.nota < L.umbral).length;
      $("resumen").innerHTML = `Vas a publicar <b class="font-semibold">${hechas.length} notas</b> · promedio <b class="tnum font-semibold">${prom}</b> · ${bajas} bajo ${L.umbral}, con justificación. <span class="text-muted">Los estudiantes reciben un aviso y queda en la auditoría.</span>`;
      $("publicar").innerHTML = `<i data-lucide="send" class="size-[18px]"></i>Publicar ${hechas.length} notas`;
      P1.iconos();
      const inp = document.querySelector(`[data-nota="${act}"]`); if (inp && document.activeElement?.tagName !== "INPUT") inp.focus({ preventScroll: true });
    };
    document.addEventListener("keydown", (e) => {
      const enJust = e.target.dataset && e.target.dataset.just !== undefined;
      if (!enJust && (e.key === "j" || e.key === "k")) { e.preventDefault(); act = Math.max(0, Math.min(filas.length - 1, act + (e.key === "j" ? 1 : -1))); document.activeElement.blur(); pinta(); }
      if (e.key === "Enter") {
        const f = filas[act], v = parseInt(document.querySelector(`[data-nota="${act}"]`).value, 10);
        const j = document.querySelector(`[data-just="${act}"]`); if (j) f.justificacion = j.value.trim();
        if (Number.isNaN(v) || v < 0 || v > 100) return;
        f.nota = v; f.guardada = !(v < L.umbral && !f.justificacion);
        if (f.guardada) act = Math.min(filas.length - 1, act + 1);
        document.activeElement.blur(); pinta();
      }
    });
    pinta();

    P1.iconos();
  </script>
</body>
</html>
