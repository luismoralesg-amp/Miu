<!doctype html>
<html lang="es" data-piel="p2">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hoy · P2 Color por curso</title>
<link rel="stylesheet" href="assets/tokens.css" />
<script src="assets/seed.js"></script>
<script src="assets/setup.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body>
  <div class="mx-auto max-w-[1280px] px-4 pb-10 md:px-10 md:pb-16">
    <header class="flex h-16 items-center justify-between gap-4 md:h-20">
      <a href="#" class="flex items-center gap-2.5"><span class="shield" style="--h: 30px"></span><span class="text-[19px] font-semibold tracking-[-0.02em]">MiU</span></a>
      <nav aria-label="Principal" class="hidden rounded-full bg-card p-1 shadow-card lg:flex dark:border dark:border-line">
        <a href="#" aria-current="page" class="rounded-full bg-ink px-4 py-2 text-sm font-medium text-card">Hoy</a>
        <a href="#" class="rounded-full px-4 py-2 text-sm font-medium text-muted hover:text-ink">Cursos</a>
        <a href="#" class="rounded-full px-4 py-2 text-sm font-medium text-muted hover:text-ink">Horario</a>
        <a href="#" class="rounded-full px-4 py-2 text-sm font-medium text-muted hover:text-ink">Notas</a>
        <a href="#" class="rounded-full px-4 py-2 text-sm font-medium text-muted hover:text-ink">Pagos</a>
      </nav>
      <div class="flex items-center gap-2">
        <button class="hidden h-11 items-center gap-2 rounded-full bg-card pr-2 pl-4 text-sm text-muted shadow-card md:flex dark:border dark:border-line"><i data-lucide="search" class="size-4"></i>Buscar<kbd class="ml-6 rounded-md bg-subtle px-1.5 py-0.5 text-xs">⌘K</kbd></button>
        <button aria-label="Notificaciones" class="grid size-11 place-items-center rounded-full bg-card shadow-card dark:border dark:border-line"><i data-lucide="bell" class="size-[18px]"></i></button>
        <span data-fill="iniciales" class="grid size-11 place-items-center rounded-full bg-card text-sm font-semibold shadow-card dark:border dark:border-line"></span>
      </div>
    </header>

    <!-- Greeting over a campus photo (local placeholder) -->
    <section class="reveal relative isolate mt-2 overflow-hidden rounded-[28px]" style="--i: 0">
      <img src="assets/campus-placeholder.svg" alt="" class="absolute inset-0 -z-10 size-full object-cover" />
      <div aria-hidden="true" class="absolute inset-0 -z-10 bg-gradient-to-t from-black/80 via-black/55 to-black/25"></div>
      <div class="flex min-h-[200px] flex-col justify-end gap-4 p-6 text-white md:min-h-[240px] md:flex-row md:items-end md:justify-between md:p-10">
        <div>
          <p class="text-[15px] text-white/90"><span data-fill="fecha-larga"></span> · <span data-fill="semana"></span></p>
          <h1 data-fill="saludo" class="mt-1 text-[34px] leading-[1.05] font-semibold tracking-[-0.035em] md:text-[52px]"></h1>
        </div>
        <div id="aviso"></div>
      </div>
      <span class="absolute top-3 right-4 rounded-full bg-black/55 px-2.5 py-1 text-[11px] font-medium text-white">Imagen de ejemplo · la UFM provee la foto</span>
    </section>

    <main class="mt-6 flex flex-col gap-6">
      <div id="hero" class="reveal" style="--i: 1"></div>

      <section class="reveal rounded-[28px] bg-card p-6 shadow-card md:p-8 dark:border dark:border-line" style="--i: 2" aria-labelledby="dia-t">
        <div class="flex items-baseline justify-between gap-4">
          <div><h2 id="dia-t" class="text-xl font-semibold tracking-[-0.02em] md:text-2xl">Tu día</h2><p id="dia-resumen" class="mt-1 text-sm text-muted"></p></div>
          <a href="#" class="inline-flex min-h-11 shrink-0 items-center text-sm font-medium text-muted hover:text-ink">Semana<span class="hidden sm:inline">&nbsp;completa</span></a>
        </div>
        <div id="dia"></div>
      </section>

      <div class="grid gap-6 md:grid-cols-12">
        <section class="reveal rounded-[28px] bg-card p-6 shadow-card md:col-span-7 md:p-8 dark:border dark:border-line" style="--i: 3" aria-labelledby="pe-t">
          <div class="flex items-baseline justify-between"><h2 id="pe-t" class="text-xl font-semibold tracking-[-0.02em] md:text-2xl">Por entregar</h2><a id="pe-total" href="#" class="inline-flex min-h-11 items-center text-sm font-medium text-muted hover:text-ink"></a></div>
          <ul id="pendientes" class="mt-3 -mx-3 flex flex-col"></ul>
        </section>
        <section class="reveal rounded-[28px] bg-card p-6 shadow-card md:col-span-5 md:p-8 dark:border dark:border-line" style="--i: 4" aria-labelledby="no-t">
          <div class="flex items-baseline justify-between"><h2 id="no-t" class="text-xl font-semibold tracking-[-0.02em] md:text-2xl">Novedades</h2><span id="no-nuevas" class="text-sm text-muted"></span></div>
          <ul id="novedades" class="mt-3 -mx-3 flex flex-col"></ul>
        </section>
      </div>
    </main>
  </div>

  <nav aria-label="Principal" class="fixed inset-x-0 bottom-0 border-t border-line bg-card/95 pb-5 lg:hidden">
    <ul class="grid grid-cols-5 text-[11px] font-medium">
      <li><a href="#" aria-current="page" class="flex min-h-14 flex-col items-center justify-center gap-1 text-ink"><i data-lucide="sun" class="size-6"></i>Hoy</a></li>
      <li><a href="#" class="flex min-h-14 flex-col items-center justify-center gap-1 text-muted"><i data-lucide="book-open" class="size-6"></i>Cursos</a></li>
      <li><a href="#" class="flex min-h-14 flex-col items-center justify-center gap-1 text-muted"><i data-lucide="calendar" class="size-6"></i>Horario</a></li>
      <li><a href="#" class="flex min-h-14 flex-col items-center justify-center gap-1 text-muted"><i data-lucide="chart-no-axes-column" class="size-6"></i>Notas</a></li>
      <li><a href="#" class="flex min-h-14 flex-col items-center justify-center gap-1 text-muted"><i data-lucide="wallet" class="size-6"></i>Pagos</a></li>
    </ul>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/lucide@1.61.0/dist/umd/lucide.min.js"></script>
  <script>
    const H = MIU.hoy(), $ = (id) => document.getElementById(id);
    const icono = { nota: "badge-check", documento: "file-text", anuncio: "megaphone" };
    const chip = (k) => { const c = MIU.curso(k); return `<span class="c-${c.slot} inline-flex items-center gap-1.5"><span class="bg-c size-2.5 rounded-full"></span>${c.corto}</span>`; };

    if (H.aviso) $("aviso").innerHTML = `
      <a href="#" class="flex min-h-11 items-center gap-2 self-start rounded-full bg-white/95 py-1.5 pr-4 pl-1.5 text-sm text-[#141414]">
        <span class="grid size-8 place-items-center rounded-full bg-[#fff4e0] text-[#9a4d00]"><i data-lucide="wallet" class="size-4"></i></span>
        <span><span class="tnum font-semibold">${MIU.quetzales(H.aviso.monto)}</span> <span class="text-[#5f6066]">vence en ${H.aviso.dias} días</span></span></a>`;

    const p = H.proximo, f = MIU.faltan(p.fecha), c = MIU.curso(p.curso), urgente = p.estado === "urgente";
    $("hero").innerHTML = `
      <article class="${urgente ? "bg-gradient-to-br from-ufm to-ufm-deep text-white" : "bg-card shadow-card"} flex flex-col gap-6 rounded-[28px] p-6 md:flex-row md:items-center md:justify-between md:px-9 md:py-7">
        <div>
          <p class="mb-2 inline-flex items-center gap-1.5 rounded-full bg-white/95 px-2.5 py-1 text-xs font-semibold text-[#141414] c-${c.slot}"><span class="bg-c size-2 rounded-full"></span>${c.nombre}</p>
          <h2 class="text-[28px] leading-[1.08] font-semibold tracking-[-0.03em] md:text-[36px]">${p.titulo}</h2>
          <p class="mt-1.5 text-[15px] ${urgente ? "text-white/90" : "text-muted"}">${MIU.cap(MIU.relativo(p.fecha))}, ${MIU.hhmm(MIU.parse(p.fecha))} · ${p.salon} · vale ${p.peso}%</p>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-4 md:justify-end">
          <p class="tnum flex items-baseline gap-1 leading-none font-semibold tracking-[-0.045em]"><span class="text-[52px] md:text-[64px]">${f.h}</span><span class="text-lg font-medium">h</span><span class="ml-2 text-[52px] md:text-[64px]">${f.min}</span><span class="text-lg font-medium">min</span></p>
          <a href="#" class="inline-flex h-12 shrink-0 items-center gap-2 rounded-full bg-white px-5 text-[15px] font-semibold text-[#c21d1d]">Repasar<i data-lucide="arrow-right" class="size-[18px]"></i></a>
        </div>
      </article>`;

    $("dia-resumen").textContent = `${H.clases.length} clases · ${MIU.duracion(H.libre)} libres entre clases`;
    const horas = Array.from({ length: 12 }, (_, i) => i + 7);
    $("dia").innerHTML = `
      <div class="relative mt-8 hidden md:block">
        <div class="tnum relative h-4 text-xs text-muted">${horas.map((h, i) => `<span class="absolute ${i === 0 ? "" : i === 11 ? "-translate-x-full" : "-translate-x-1/2"}" style="left:${(i / 11) * 100}%">${String(h).padStart(2, "0")}</span>`).join("")}</div>
        <div class="relative mt-3 h-[96px] rounded-2xl bg-subtle">
          ${H.huecos.map((h) => `<p class="absolute inset-y-0 flex items-center justify-center gap-1.5 text-sm text-muted" style="left:${h.left}%;width:${h.width}%">${h.min >= 90 ? `<i data-lucide="coffee" class="size-4"></i>${MIU.duracion(h.min)} libres` : MIU.duracion(h.min)}</p>`).join("")}
          <span aria-hidden="true" class="absolute -top-1.5 -bottom-1.5 w-0.5 rounded-full bg-ink" style="left:${H.ahoraPos}%"><span class="absolute -top-1 -left-[3px] size-2 rounded-full bg-ink"></span></span>
          ${H.clases.map((k) => `<a href="#" class="c-${k.slot} tint-c absolute inset-y-2 rounded-xl px-3 py-2.5 ${k.estado === "ahora" ? "ring-2 ring-[var(--c)] z-10" : ""}" style="left:${k.left}%;width:${k.width}%">
              <p class="flex items-center gap-1.5 truncate text-sm font-semibold"><span class="bg-c size-2 shrink-0 rounded-full"></span>${k.corto}</p>
              <p class="mt-1 truncate text-xs text-muted">${k.estado === "ahora" ? "Ahora" : k.ini} · ${k.salon.split(" ")[0]}</p></a>`).join("")}
        </div>
      </div>
      <ol class="mt-5 flex flex-col gap-2 md:hidden">${H.clases.map((k, i) => `
        ${i > 0 && H.huecos[i - 1] ? `<li class="px-4 py-1 text-sm text-muted">${MIU.duracion(H.huecos[i - 1].min)} libres</li>` : ""}
        <li><a href="#" class="c-${k.slot} tint-c flex min-h-14 items-center gap-4 rounded-2xl px-4 py-3 ${k.estado === "ahora" ? "ring-2 ring-[var(--c)]" : ""}"><span class="tnum w-12 text-sm ${k.estado === "ahora" ? "font-semibold" : "text-muted"}">${k.ini}</span><span class="flex-1"><span class="flex items-center gap-1.5 font-semibold"><span class="bg-c size-2 rounded-full"></span>${k.nombre}</span><span class="text-sm text-muted">${k.estado === "ahora" ? "Ahora · " : ""}${k.salon}</span></span></a></li>`).join("")}</ol>`;

    $("pe-total").textContent = `Ver las ${H.totalPendientes}`;
    $("pendientes").innerHTML = H.porEntregar.map((e) => `
      <li><a href="#" class="tap flex min-h-16 items-center justify-between gap-4 rounded-xl px-3 py-3">
        <span class="min-w-0"><span class="block font-semibold">${e.titulo}</span><span class="text-sm text-muted">${chip(e.curso)}</span></span>
        <span class="tnum shrink-0 text-sm ${MIU.diasDesdeHoy(e.fecha) <= 1 ? "font-semibold" : "text-muted"}">${MIU.vence(e.fecha)}</span></a></li>`).join("");

    $("no-nuevas").textContent = `${H.nuevas} nuevas`;
    $("novedades").innerHTML = H.novedades.map((n) => { const k = MIU.curso(n.curso); return `
      <li><a href="#" class="tap flex min-h-16 items-start gap-3 rounded-xl px-3 py-3">
        <span class="c-${k.slot} tint-c mt-0.5 grid size-9 shrink-0 place-items-center rounded-full"><i data-lucide="${icono[n.tipo]}" class="size-[18px]"></i></span>
        <span class="min-w-0 flex-1"><span class="block text-[15px] ${n.nueva ? "font-semibold" : ""}">${n.texto}</span><span class="text-sm text-muted">${k.corto} · ${n.quien} · ${MIU.hace(n.fecha)}</span></span>
        ${n.nueva ? '<span class="sr-only">Nueva</span><span aria-hidden="true" class="mt-2 size-2 shrink-0 rounded-full bg-info"></span>' : ""}</a></li>`; }).join("");

    lucide.createIcons({ attrs: { "stroke-width": 1.75, "aria-hidden": "true" } });
  </script>
</body>
</html>
