<!doctype html>
<html lang="es" data-piel="p1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Por entregar · MiU</title>
<link rel="stylesheet" href="assets/tokens.css" />
<script src="assets/seed.js"></script>
<script src="assets/setup.js"></script>
<script src="assets/p1.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body>
  <div class="mx-auto max-w-[1240px] px-5 pb-10 md:px-12 md:pb-20">
    <div id="shell-top"></div>
    <section class="pt-10 pb-6 md:pt-14">
      <p class="text-[15px] text-muted"><span data-fill="fecha-larga"></span></p>
      <h1 class="display mt-2 text-[40px] leading-[1.02] font-medium md:text-[64px]">Por entregar</h1>
      <p id="resumen" class="mt-3 text-[15px] text-muted"></p>
    </section>
    <main><ul id="lista" class="divide-y divide-line border-y border-line"></ul></main>
    <style>
      .exp { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 280ms var(--ease-out), opacity 200ms ease; }
      .exp > div { overflow: hidden; }
      [aria-expanded="true"] + .exp { grid-template-rows: 1fr; opacity: 1; }
      @media (prefers-reduced-motion: reduce) { .exp { transition: opacity 150ms ease; } }
    </style>
  </div>
  <div id="shell-bottom"></div>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.61.0/dist/umd/lucide.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    P1.shell("hoy");
    const S = window.SEED;
    const lista = S.entregas.filter((e) => MIU.parse(e.fecha) > MIU.HOY).sort((a, b) => MIU.parse(a.fecha) - MIU.parse(b.fecha));
    $("resumen").textContent = `${lista.length} entregas pendientes · la más próxima vence ${MIU.vence(lista[0].fecha).toLowerCase()}`;
    $("lista").innerHTML = lista.map((e, i) => { const c = MIU.curso(e.curso), d = MIU.parse(e.fecha); return `
      <li>
        <button type="button" aria-expanded="${i === 0}" aria-controls="det-${e.id}" class="tap flex min-h-16 w-full items-center justify-between gap-4 rounded-lg px-2 py-4 text-left">${P1.pendiente(e)}</button>
        <div id="det-${e.id}" role="region" aria-label="Detalle de ${e.titulo}" class="exp"><div>
          <div class="grid gap-8 px-2 pt-2 pb-8 md:grid-cols-12">
            <dl class="grid grid-cols-2 gap-x-6 gap-y-4 text-[15px] md:col-span-5">
              <div><dt class="text-sm text-muted">Fecha límite</dt><dd class="mt-0.5 font-semibold">${MIU.cap(MIU.fechaLarga(d))}, ${MIU.hhmm(d)}</dd></div>
              <div><dt class="text-sm text-muted">Formato</dt><dd class="mt-0.5">${e.formato}</dd></div>
              <div><dt class="text-sm text-muted">Entrega atrasada</dt><dd class="mt-0.5">${e.atrasada ? "Se permite" : "No se permite"}</dd></div>
              <div><dt class="text-sm text-muted">Curso</dt><dd class="mt-0.5"><span class="flex items-center gap-1.5">${P1.dot(e.curso)}${c.corto}</span><span class="text-sm text-muted">${c.auxiliar ? `${c.auxiliar}, auxiliar` : c.catedratico}</span></dd></div>
            </dl>
            <div class="md:col-span-4">
              <p class="text-sm text-muted">Rúbrica</p>
              <ul class="mt-2 divide-y divide-line border-y border-line text-[15px]">${(e.rubrica ?? [["Según el enunciado", 100]]).map(([k, v]) => `<li class="flex justify-between py-2"><span>${k}</span><span class="tnum font-semibold">${v}%</span></li>`).join("")}</ul>
            </div>
            <div class="flex flex-col gap-3 md:col-span-3">
              <label class="flex min-h-24 cursor-pointer flex-col items-center justify-center gap-1 rounded-xl border border-dashed border-line px-4 py-4 text-center text-sm text-muted hover:bg-subtle"><i data-lucide="upload" class="size-5"></i>Suelta el archivo o elígelo<input type="file" class="sr-only" /></label>
              <button type="button" class="inline-flex h-12 items-center justify-center gap-2 rounded-full bg-ink px-5 text-[15px] font-semibold text-card">Entregar</button>
              <p class="text-xs text-muted">Recibirás un comprobante con la hora y la huella del archivo.</p>
            </div>
          </div>
        </div></div>
      </li>`; }).join("");
    const toggle = (btn, open) => btn.setAttribute("aria-expanded", String(open ?? btn.getAttribute("aria-expanded") !== "true"));
    document.querySelectorAll("#lista > li > button").forEach((b) => b.addEventListener("click", () => toggle(b)));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll('#lista [aria-expanded="true"]').forEach((b) => { toggle(b, false); b.focus(); }); });

    P1.iconos();
  </script>
</body>
</html>
