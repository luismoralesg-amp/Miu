<!doctype html>
<html lang="es" data-piel="p1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Semana · MiU</title>
<link rel="stylesheet" href="assets/tokens.css" />
<script src="assets/seed.js"></script>
<script src="assets/setup.js"></script>
<script src="assets/p1.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body>
  <div class="mx-auto max-w-[1240px] px-5 pb-10 md:px-12 md:pb-20">
    <div id="shell-top"></div>
    <section class="reveal flex flex-col gap-3 pt-10 pb-8 md:flex-row md:items-end md:justify-between md:pt-14 md:pb-10" style="--i: 0">
      <div>
        <p class="text-[15px] text-muted"><span data-fill="semana"></span></p>
        <h1 id="titulo" class="display mt-2 text-[40px] leading-[1.02] font-medium md:text-[56px]"></h1>
      </div>
      <p class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-muted" aria-label="Leyenda de carga">
        <span class="flex items-center gap-1.5"><span class="flex gap-0.5"><i class="h-3 w-1.5 rounded-sm bg-ink"></i><i class="h-3 w-1.5 rounded-sm bg-line"></i><i class="h-3 w-1.5 rounded-sm bg-line"></i></span>Ligera</span>
        <span class="flex items-center gap-1.5"><span class="flex gap-0.5"><i class="h-3 w-1.5 rounded-sm bg-ink"></i><i class="h-3 w-1.5 rounded-sm bg-ink"></i><i class="h-3 w-1.5 rounded-sm bg-line"></i></span>Media</span>
        <span class="flex items-center gap-1.5"><span class="flex gap-0.5"><i class="h-3 w-1.5 rounded-sm bg-ink"></i><i class="h-3 w-1.5 rounded-sm bg-ink"></i><i class="h-3 w-1.5 rounded-sm bg-ink"></i></span>Pesada</span>
      </p>
    </section>
    <main>
      <ol id="semana" class="reveal grid border-y border-line lg:grid-cols-7 lg:divide-x lg:divide-line" style="--i: 1"></ol>
    </main>
  </div>
  <div id="shell-bottom"></div>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.61.0/dist/umd/lucide.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    P1.shell("semana");
    const S = window.SEED, lunes = MIU.lunes();
    const dom = new Date(lunes); dom.setDate(dom.getDate() + 6);
    $("titulo").textContent = `Del ${lunes.getDate()} al ${dom.getDate()} de ${MIU.MESES[dom.getMonth()]}`;
    const nivel = (p) => (p === 0 ? ["Libre", 0] : p <= 2.5 ? ["Ligera", 1] : p <= 5 ? ["Media", 2] : ["Pesada", 3]);
    $("semana").innerHTML = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(lunes); d.setDate(d.getDate() + i);
      const n = MIU.diasDesdeHoy(d);
      const items = [
        ...MIU.clasesDe(d).map((c) => ({ t: c.ini, k: c.codigo, txt: c.corto, sub: c.salon.split(" ")[0], tipo: "clase" })),
        ...S.examenes.filter((x) => MIU.diasDesdeHoy(x.fecha) === n).map((x) => ({ t: MIU.hhmm(MIU.parse(x.fecha)), k: x.curso, txt: `${x.titulo} de ${MIU.curso(x.curso).corto}`, sub: x.salon.split(" ")[0], tipo: "examen" })),
        ...S.entregas.filter((e) => MIU.diasDesdeHoy(e.fecha) === n).map((e) => ({ t: MIU.hhmm(MIU.parse(e.fecha)), k: e.curso, txt: e.titulo, sub: "Entrega", tipo: "entrega" })),
      ].sort((a, b) => a.t.localeCompare(b.t));
      const peso = items.reduce((s, x) => s + (x.tipo === "examen" ? 3 : x.tipo === "entrega" ? 1.5 : 1), 0);
      const [etq, barras] = nivel(peso);
      return `
      <li class="flex flex-col gap-4 border-b border-line py-5 lg:min-h-[420px] lg:border-b-0 lg:px-4 ${n === 0 ? "bg-card" : ""} ${n < 0 ? "text-muted" : ""}">
        <div class="flex items-baseline justify-between gap-2 lg:flex-col lg:items-start">
          <p class="${n === 0 ? "font-semibold" : ""}"><span class="text-[15px]">${MIU.cap(MIU.DIAS[d.getDay()])}${n === 0 ? " · hoy" : ""}</span> <span class="display tnum text-[28px]">${d.getDate()}</span></p>
          <p class="flex items-center gap-2 text-sm text-muted"><span class="flex gap-0.5" aria-hidden="true">${[1, 2, 3].map((b) => `<i class="h-3 w-1.5 rounded-sm ${b <= barras ? "bg-ink" : "bg-line"}"></i>`).join("")}</span>Carga ${etq.toLowerCase()}</p>
        </div>
        <ul class="flex flex-col gap-2">${items.length ? items.map((x) => `
          <li><a href="${x.tipo === "entrega" ? "tarjeta-expandible.html" : "curso-linea-de-tiempo.html"}" class="tap -mx-2 flex min-h-11 flex-col rounded-lg px-2 py-1.5 ${x.tipo === "examen" ? "ring-1 ring-ink" : ""}">
            <span class="tnum text-xs text-muted">${x.t} · ${x.tipo === "examen" ? "Examen" : x.sub}</span>
            <span class="flex items-start gap-1.5 text-sm ${x.tipo === "clase" ? "" : "font-semibold"}"><span class="mt-1.5">${P1.dot(x.k)}</span><span>${x.txt}</span></span></a></li>`).join("") : '<li class="text-sm text-muted italic">Sin clases ni entregas</li>'}</ul>
      </li>`;
    }).join("");

    P1.iconos();
  </script>
</body>
</html>
