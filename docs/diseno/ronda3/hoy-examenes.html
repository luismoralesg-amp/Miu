<!doctype html>
<html lang="es" data-piel="p1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hoy · semana de exámenes</title>
<link rel="stylesheet" href="assets/tokens.css" />
<script src="assets/seed.js"></script>
<script src="assets/setup.js"></script>
<script src="assets/p1.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body>
  <div class="mx-auto max-w-[1240px] px-5 pb-10 md:px-12 md:pb-20">
    <div id="shell-top"></div>
    <section class="reveal flex flex-col gap-3 pt-10 pb-8 md:pt-14 md:pb-10" style="--i: 0">
      <p class="text-[15px] text-muted"><span data-fill="fecha-larga"></span> · <span data-fill="semana"></span> · <span class="font-semibold text-ink">semana de exámenes</span></p>
      <h1 class="display text-[40px] leading-[1.02] font-medium md:text-[64px]">Cuatro exámenes en <span id="ventana"></span> días</h1>
    </section>
    <main class="flex flex-col">
      <div id="hero" class="reveal" style="--i: 1"></div>
      <section class="reveal border-b border-line py-10 md:py-12" style="--i: 2" aria-labelledby="cal-t">
        <h2 id="cal-t" class="display text-[28px] font-medium md:text-[34px]">Calendario de exámenes</h2>
        <ol id="calendario" class="mt-6 grid gap-px overflow-hidden rounded-[16px] border border-line bg-line sm:grid-cols-2 lg:grid-cols-4"></ol>
      </section>
      <section class="reveal py-10 md:py-12" style="--i: 3" aria-labelledby="lib-t">
        <div class="flex flex-wrap items-baseline justify-between gap-2">
          <h2 id="lib-t" class="display text-[28px] font-medium md:text-[34px]">Horas libres para estudiar</h2>
          <p class="text-sm text-muted">Entre 07:00 y 21:00, sin clases ni exámenes</p>
        </div>
        <ol id="libres" class="mt-6 flex flex-col"></ol>
      </section>
    </main>
  </div>
  <div id="shell-bottom"></div>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.61.0/dist/umd/lucide.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    P1.shell("hoy");
    const S = window.SEED;
    const xs = S.examenes.filter((x) => MIU.parse(x.fecha) > MIU.HOY).sort((a, b) => MIU.parse(a.fecha) - MIU.parse(b.fecha));
    const ultimo = xs[xs.length - 1];
    $("ventana").textContent = MIU.diasDesdeHoy(ultimo.fecha) + 1;
    $("hero").innerHTML = P1.hero(MIU.hoy().proximo);
    $("calendario").innerHTML = xs.map((x, i) => { const c = MIU.curso(x.curso), d = MIU.parse(x.fecha); return `
      <li class="flex flex-col gap-3 bg-card p-6 ${i === 0 ? "" : ""}">
        <p class="flex items-center justify-between text-sm text-muted"><span class="font-semibold text-ink">${MIU.cap(MIU.DIAS[d.getDay()])} ${d.getDate()}</span><span>${MIU.diasDesdeHoy(x.fecha) === 1 ? "mañana" : `en ${MIU.diasDesdeHoy(x.fecha)} días`}</span></p>
        <p class="display text-[24px] leading-tight font-medium">${c.nombre}</p>
        <p class="flex items-center gap-2 text-sm text-muted">${P1.dot(x.curso)}${x.titulo} · ${MIU.hhmm(d)} · ${x.salon.split(" ")[0]}</p>
        <p class="text-sm"><span class="tnum font-semibold">${x.peso}%</span> <span class="text-muted">de la nota · ${x.temas}</span></p>
      </li>`; }).join("");
    const VENTANA = [7 * 60, 21 * 60];
    const dias = [];
    for (let i = 0; i <= MIU.diasDesdeHoy(ultimo.fecha); i++) {
      const d = new Date(MIU.HOY); d.setDate(d.getDate() + i); d.setHours(0, 0, 0, 0);
      const ocupado = [...MIU.clasesDe(d).map((c) => [MIU.minutos(c.ini), MIU.minutos(c.fin)]),
        ...S.examenes.filter((x) => MIU.diasDesdeHoy(x.fecha) === i).map((x) => [MIU.minutos(MIU.hhmm(MIU.parse(x.fecha))), MIU.minutos(x.fin)])];
      let inicio = i === 0 ? Math.max(VENTANA[0], MIU.HOY.getHours() * 60 + MIU.HOY.getMinutes()) : VENTANA[0];
      const libre = Math.max(0, VENTANA[1] - inicio - ocupado.reduce((s, [a, b]) => s + Math.max(0, Math.min(b, VENTANA[1]) - Math.max(a, inicio)), 0));
      dias.push({ d, libre, examen: S.examenes.find((x) => MIU.diasDesdeHoy(x.fecha) === i) });
    }
    const max = Math.max(...dias.map((x) => x.libre));
    $("libres").innerHTML = dias.map(({ d, libre, examen }) => `
      <li class="grid grid-cols-[6.5rem_1fr_4.5rem] items-center gap-4 border-b border-line py-3 md:grid-cols-[9rem_1fr_6rem]">
        <span class="text-[15px] ${MIU.diasDesdeHoy(d) === 0 ? "font-semibold" : ""}">${MIU.cap(MIU.relativo(d) === "hoy" ? "hoy" : MIU.DIAS[d.getDay()])} ${d.getDate()}</span>
        <span class="flex items-center gap-3"><span class="h-2 rounded-full bg-ink" style="width:${(libre / max) * 100}%"></span>${examen ? `<span class="flex shrink-0 items-center gap-1.5 text-xs text-muted">${P1.dot(examen.curso)}${examen.titulo}</span>` : ""}</span>
        <span class="tnum text-right text-[15px] font-semibold">${MIU.duracion(libre)}</span></li>`).join("");

    P1.iconos();
  </script>
</body>
</html>
