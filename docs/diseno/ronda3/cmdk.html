<!doctype html>
<html lang="es" data-piel="p1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buscar o hacer algo · MiU</title>
<link rel="stylesheet" href="assets/tokens.css" />
<script src="assets/seed.js"></script>
<script src="assets/setup.js"></script>
<script src="assets/p1.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body>
  <div class="mx-auto max-w-[1240px] px-5 pb-10 md:px-12 md:pb-20">
    <div id="shell-top"></div>
    <section class="pt-10 pb-8 md:pt-14" aria-hidden="true">
      <p class="text-[15px] text-muted"><span data-fill="fecha-larga"></span> · <span data-fill="semana"></span></p>
      <h1 data-fill="saludo" class="display mt-2 text-[40px] leading-[1.02] font-medium md:text-[64px]"></h1>
      <div id="hero" class="mt-8"></div>
    </section>

    <div id="cmdk" class="fixed inset-0 z-50 flex items-start justify-center bg-black/40 px-3 pt-3 md:pt-[12vh]">
      <div role="dialog" aria-modal="true" aria-label="Buscar o hacer algo" class="flex max-h-[80vh] w-full max-w-[640px] flex-col overflow-hidden rounded-[20px] border border-line bg-card shadow-float">
        <div class="flex items-center gap-3 border-b border-line px-5">
          <i data-lucide="search" class="size-5 text-muted"></i>
          <input id="q" role="combobox" aria-expanded="true" aria-controls="res" aria-activedescendant="" autocomplete="off" placeholder="Busca o escribe una acción: pagar, entregar, horario…" class="h-16 flex-1 bg-transparent text-[17px] outline-none placeholder:text-muted focus-visible:outline-none" />
          <kbd class="rounded border border-line px-1.5 text-xs text-muted">Esc</kbd>
        </div>
        <div id="res" role="listbox" class="overflow-y-auto px-2 py-2"></div>
        <div class="flex flex-wrap items-center gap-x-4 gap-y-1 border-t border-line px-5 py-3 text-xs text-muted">
          <span><kbd class="rounded border border-line px-1">↑</kbd> <kbd class="rounded border border-line px-1">↓</kbd> moverte</span>
          <span><kbd class="rounded border border-line px-1">Enter</kbd> hacerlo</span>
          <span><kbd class="rounded border border-line px-1">Esc</kbd> cerrar</span>
          <span id="estado" class="ml-auto font-medium text-ink" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </div>
  <div id="shell-bottom"></div>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.61.0/dist/umd/lucide.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    P1.shell("hoy");
    const S = window.SEED, H = MIU.hoy();
    $("hero").innerHTML = P1.hero(H.proximo);
    const norm = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const jueves = MIU.clasesDe(MIU.HOY);
    const items = [
      { g: "Acciones", ic: "wallet", t: "Pagar mi saldo", s: `${MIU.quetzales(S.pago.monto)} · vence en ${MIU.diasDesdeHoy(S.pago.vence)} días`, href: "pagos.html", k: "pagar saldo cuota deuda" },
      { g: "Acciones", ic: "upload", t: "Entregar Ejercicio de llaves", s: `Paradigmas · ${MIU.vence("2026-10-23T23:59").toLowerCase()}`, href: "tarjeta-expandible.html", k: "entregar subir tarea llaves" },
      { g: "Acciones", ic: "calendar", t: `Horario del ${MIU.DIAS[MIU.HOY.getDay()]}`, s: `${jueves.length} clases · ${jueves.map((c) => c.corto).join(", ")}`, href: "semana.html", k: "horario jueves clases hoy" },
      { g: "Acciones", ic: "calculator", t: "Simular mi nota de Discreta", s: "¿Qué necesito para 71, 80 o 90?", href: "notas.html", k: "nota simular necesito discreta" },
      ...Object.keys(S.cursos).map((k) => ({ g: "Cursos", dot: k, t: S.cursos[k].nombre, s: `Sección ${S.cursos[k].seccion} · ${S.cursos[k].catedratico}`, href: "curso-linea-de-tiempo.html", k: "curso" })),
      ...[...S.examenes, ...S.entregas].filter((x) => MIU.parse(x.fecha) > MIU.HOY).sort((a, b) => MIU.parse(a.fecha) - MIU.parse(b.fecha)).slice(0, 5)
        .map((x) => ({ g: "Actividades", dot: x.curso, t: x.peso ? `${x.titulo} de ${MIU.curso(x.curso).corto}` : x.titulo, s: MIU.vence(x.fecha), href: "tarjeta-expandible.html", k: "actividad entrega examen" })),
      ...[["Jorge Castillo", "Catedrático · Discreta"], ["Sofía Ramírez", "Auxiliar · Discreta"], ["Carlos Méndez", "Auxiliar · Paradigmas"], ["Lucía Herrera", "Catedrática · Ética"]]
        .map(([t, s]) => ({ g: "Personas", ic: "user-round", t, s, href: "#", k: "persona profesor" })),
    ];
    let activo = 0, visibles = [];
    const render = () => {
      const q = norm($("q").value.trim());
      visibles = items.filter((x) => !q || norm(`${x.t} ${x.s} ${x.k}`).includes(q));
      const grupos = [...new Set(visibles.map((x) => x.g))];
      let i = 0;
      $("res").innerHTML = visibles.length ? grupos.map((g) => {
        const lista = visibles.filter((x) => x.g === g).slice(0, q ? 8 : g === "Acciones" ? 4 : 3);
        return `<p class="px-3 pt-3 pb-1 text-xs font-semibold text-muted">${g}</p>` + lista.map((x) => { const n = visibles.indexOf(x); return `
          <a id="op-${n}" role="option" aria-selected="${n === activo}" href="${x.href}" data-n="${n}" class="flex min-h-12 items-center gap-3 rounded-xl px-3 py-2 ${n === activo ? "bg-subtle" : ""}">
            ${x.dot ? `<span class="grid size-8 place-items-center">${P1.dot(x.dot, "size-2.5")}</span>` : `<span class="grid size-8 place-items-center rounded-lg border border-line"><i data-lucide="${x.ic}" class="size-4"></i></span>`}
            <span class="min-w-0 flex-1"><span class="block truncate text-[15px] ${x.g === "Acciones" ? "font-semibold" : ""}">${x.t}</span><span class="block truncate text-sm text-muted">${x.s}</span></span>
            ${n === activo ? '<kbd class="rounded border border-line px-1.5 text-xs text-muted">Enter</kbd>' : ""}</a>`; }).join("");
      }).join("") : `<p class="px-3 py-8 text-center text-[15px] text-muted">Nada coincide con “${$("q").value}”. Prueba con un curso, una persona o “pagar”.</p>`;
      $("q").setAttribute("aria-activedescendant", visibles.length ? `op-${activo}` : "");
      P1.iconos();
    };
    $("q").addEventListener("input", () => { activo = 0; render(); });
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("cmdk").hidden = false; $("q").focus(); return; }
      if ($("cmdk").hidden) return;
      if (e.key === "ArrowDown") { e.preventDefault(); activo = Math.min(activo + 1, visibles.length - 1); render(); }
      if (e.key === "ArrowUp") { e.preventDefault(); activo = Math.max(activo - 1, 0); render(); }
      if (e.key === "Enter" && visibles[activo]) { e.preventDefault(); $("estado").textContent = `${visibles[activo].t}…`; }
      if (e.key === "Escape") { $("cmdk").hidden = true; }
    });
    $("cmdk").addEventListener("click", (e) => { if (e.target.id === "cmdk") $("cmdk").hidden = true; });
    render(); $("q").focus();

    P1.iconos();
  </script>
</body>
</html>
