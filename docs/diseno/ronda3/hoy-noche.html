<!doctype html>
<html lang="es" data-piel="p1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hoy · noche</title>
<link rel="stylesheet" href="assets/tokens.css" />
<script>window.MIU_HOY = "2026-10-22T20:15:00";</script>
<script src="assets/seed.js"></script>
<script src="assets/setup.js"></script>
<script src="assets/p1.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body>
  <div class="mx-auto max-w-[1240px] px-5 pb-10 md:px-12 md:pb-20">
    <div id="shell-top"></div>
    <section class="reveal pt-10 pb-8 md:pt-14 md:pb-10" style="--i: 0">
      <p class="text-[15px] text-muted"><span data-fill="fecha-larga"></span> · <span data-fill="semana"></span></p>
      <h1 data-fill="saludo" class="display mt-2 text-[40px] leading-[1.02] font-medium md:text-[64px]"></h1>
    </section>

    <main class="flex flex-col">
      <div id="hero" class="reveal mb-10" style="--i: 1"></div>
      <div class="grid md:grid-cols-12 md:divide-x md:divide-line border-y border-line">
        <section class="reveal py-10 md:col-span-5 md:pr-12" style="--i: 1" aria-labelledby="hecho-t">
          <h2 id="hecho-t" class="display text-[28px] font-medium md:text-[34px]">Lo que hiciste hoy</h2>
          <ul id="hecho" class="mt-5 flex flex-col gap-4 text-[15px]"></ul>
        </section>
        <section class="reveal border-t border-line py-10 md:col-span-7 md:border-t-0 md:pl-12" style="--i: 2" aria-labelledby="man-t">
          <div class="flex items-baseline justify-between gap-4">
            <h2 id="man-t" class="display text-[28px] font-medium md:text-[34px]">Mañana</h2>
            <p id="man-fecha" class="text-sm text-muted"></p>
          </div>
          <ol id="manana" class="mt-5 divide-y divide-line border-t border-line"></ol>
        </section>
      </div>


      <section class="reveal py-10" style="--i: 4" aria-labelledby="pe-t">
        <div class="flex items-baseline justify-between">
          <h2 id="pe-t" class="display text-[28px] font-medium md:text-[34px]">Por entregar</h2>
          <a id="pe-total" href="#" class="inline-flex min-h-11 items-center text-sm font-medium text-muted hover:text-ink"></a>
        </div>
        <ul id="pendientes" class="mt-4 divide-y divide-line border-t border-line"></ul>
      </section>
    </main>
  </div>
  <div id="shell-bottom"></div>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.61.0/dist/umd/lucide.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    P1.shell("hoy");
    const H = MIU.hoy();
    const manana = new Date(MIU.HOY); manana.setDate(manana.getDate() + 1);
    const clasesHoy = MIU.clasesDe(MIU.HOY);
    const S = window.SEED;
    const hechas = S.entregadas.filter((e) => MIU.diasDesdeHoy(e.fecha) === 0);
    $("hecho").innerHTML = [
      `<li class="flex gap-3"><i data-lucide="check" class="mt-0.5 size-[18px] shrink-0"></i><span>${clasesHoy.length} clases: ${clasesHoy.map((c) => c.corto).join(", ")}</span></li>`,
      ...hechas.map((e) => `<li class="flex gap-3"><i data-lucide="check" class="mt-0.5 size-[18px] shrink-0"></i><span>Entregaste <b class="font-semibold">${e.titulo}</b> de ${MIU.curso(e.curso).corto} a las ${MIU.hhmm(MIU.parse(e.fecha))}</span></li>`),
      `<li class="flex gap-3"><i data-lucide="badge-check" class="mt-0.5 size-[18px] shrink-0"></i><span>${H.nuevas} novedades sin abrir · <a href="p1-editorial.html" class="underline underline-offset-4">verlas</a></span></li>`,
    ].join("");
    $("man-fecha").textContent = MIU.cap(MIU.fechaLarga(manana));
    const examenesManana = S.examenes.filter((x) => MIU.diasDesdeHoy(x.fecha) === 1 && x.id !== H.proximo?.id).map((x) => ({ hora: MIU.hhmm(MIU.parse(x.fecha)), titulo: `${x.titulo} de ${MIU.curso(x.curso).nombre}`, lugar: x.salon, curso: x.curso, examen: true }));
    const clasesManana = MIU.clasesDe(manana).map((c) => ({ hora: c.ini, titulo: c.nombre, lugar: c.salon, curso: c.codigo }));
    const entregasManana = S.entregas.filter((e) => MIU.diasDesdeHoy(e.fecha) === 1).map((e) => ({ hora: MIU.hhmm(MIU.parse(e.fecha)), titulo: `Entrega: ${e.titulo}`, lugar: MIU.curso(e.curso).corto, curso: e.curso }));
    $("manana").innerHTML = [...examenesManana, ...clasesManana, ...entregasManana].sort((a, b) => a.hora.localeCompare(b.hora)).map((x) => `
      <li class="flex min-h-14 items-center gap-4 py-3"><span class="tnum w-14 text-[15px] ${x.examen ? "font-semibold" : "text-muted"}">${x.hora}</span>
        <span class="flex-1"><span class="flex items-center gap-2 font-semibold">${P1.dot(x.curso)}${x.titulo}</span><span class="text-sm text-muted">${x.lugar}</span></span>
        ${x.examen ? '<span class="rounded-full border border-ink px-2 py-0.5 text-xs font-semibold">Examen</span>' : ""}</li>`).join("");
    $("hero").innerHTML = P1.hero(H.proximo, { accion: "Repasar esta noche" });
    $("pe-total").textContent = `Ver las ${H.totalPendientes}`;
    $("pendientes").innerHTML = P1.pendientes(H.porEntregar.slice(0, 3));

    P1.iconos();
  </script>
</body>
</html>
